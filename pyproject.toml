[project]
name = "rate-erosion"
version = "0.1.0"
description = "You negotiated -8%. You paid +3%. Here is where it went."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "pandas>=2.2", "numpy>=1.26"]

[project.scripts]
rate-erosion = "rate_erosion.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rate_erosion"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
